[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-signals"
version = "0.1.0"
description = "Independent external market-signal dataset for the Indian iPhone market (Market Sentiment and Demand Pressure indicators)."
readme = "README.md"
requires-python = ">=3.11"
# Core libraries named in the plan (Collection, cleaning and curation > Layout).
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "beautifulsoup4>=4.12",
    "tenacity>=8.2",
    "pandas>=2.2",
    "pyarrow>=15",
    "duckdb>=1.0",
    "rapidfuzz>=3.6",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Only for retailer pages that need JavaScript rendering.
# After installing, run `python -m playwright install chromium` once per machine.
browser = ["playwright>=1.44"]
# Source-specific API clients (Tier A sources); install when those collectors are built.
sources = [
    "google-api-python-client>=2.120",  # YouTube Data API v3
    "yfinance>=0.2.40",                  # AAPL, USD/INR
    "trendspyg>=0.1",                    # unofficial Google Trends client (pytrends is archived)
    "gdeltdoc>=1.5",                     # GDELT DOC API
    "waybackpy>=3.0.6",                  # Wayback Machine CDX
]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["market_signals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
