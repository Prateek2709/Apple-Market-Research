[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-signals"
version = "0.1.0"
description = "Independent external market-signal dataset for the Indian iPhone market (Market Sentiment and Demand Pressure indicators)."
readme = "README.md"
requires-python = ">=3.11"
# Needed by the collectors, catalogue and matching code that exist today.
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pandas>=2.2",
    "rapidfuzz>=3.6",
    "pyyaml>=6.0",
    "tzdata>=2024.1",  # IANA zones on Windows (YouTube quota day)
]

[project.optional-dependencies]
# yfinance is the unofficial client used by the AAPL / USD-INR collector (imported lazily).
sources = ["yfinance>=0.2.40"]
# Needed once parsing / silver tables are written (plan layout); not used by collection code yet.
curation = ["selectolax>=0.3.21", "beautifulsoup4>=4.12", "pyarrow>=15", "duckdb>=1.0", "pydantic>=2.6"]
# Only for retailer pages that need JavaScript rendering (not used yet).
browser = ["playwright>=1.44"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["code"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "code"]   # run.py at the root and the packages under code/ import without installing
addopts = "-ra"
