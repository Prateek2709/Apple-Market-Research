# Hand-curated India model facts: the single input to catalogue generation.
# Which of these models is built into products.csv is decided by config/active_scope.yaml,
# not by this file: a model listed here but not in the scope file is ignored, and a model in
# the scope file with no entry here is an error. Models outside the plan (16 Plus, 15 Pro,
# 16e as active, iPhone Duo, etc.) are deliberately absent.
#
# Fields
#   storage_mrp      launch MRP in INR per storage in GB (1024 = 1TB). Blank (null) = not verified.
#   colours          names as sold in India; every colour is assumed sold at every storage
#                    (colour x storage availability is NOT confirmed on the Apple India configurator).
#   predecessor      model_key of the previous generation (null = no like-for-like predecessor).
#   apple_store      listed | delisted  (state in Nov 2026 per the plan; delisting dates not verified).
#   unverified       fields that could not be confirmed; copied into the CSV.
#
# verified_on / source: Apple India (apple.com/in) was NOT reachable from the build environment,
# so every row rests on Indian press and retailer coverage found by web search on 2026-11-03.
defaults:
  verified_on: "2026-11-03"
  verified_source: "Indian press/retailer coverage via web search (Apple India not reachable from build environment)"
  common_unverified: ["apple_india_configurator", "colour_storage_availability", "part_numbers_and_retailer_ids"]

models:
